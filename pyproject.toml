[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "take-profit-stop-loss"
version = "0.1.0"
description = "A股持仓次日止盈止损建议系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "SQLAlchemy>=2.0,<3",
  "PyMySQL>=1.1,<2",
  "xgboost>=2.1,<4",
  "baostock>=0.9.2,<1",
  "akshare>=1.15,<2",
]

[project.scripts]
tpsl = "tpsl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
